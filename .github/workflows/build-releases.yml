name: Build and Release Horizon Offline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag or Version (e.g. v0.2.32-offline)'
        required: false
        default: 'v0.2.32-offline'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            binary: horizon-launcher
            asset: horizon-launcher-linux-x86_64.tar.gz
            game_asset: horizon-linux-x86_64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: horizon-launcher.exe
            asset: horizon-launcher-windows-x64.zip
            game_asset: horizon-windows-x64.zip
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: horizon-launcher
            asset: horizon-launcher-macos-arm64.tar.gz
            game_asset: ''

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libvulkan-dev libwayland-dev libx11-dev libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libfontconfig1-dev libudev-dev

      - name: Build Launcher
        run: cargo build --profile dist --manifest-path launcher/Cargo.toml --target ${{ matrix.target }}

      - name: Build Game (Windows)
        if: runner.os == 'Windows'
        run: cargo build --release -p horizon-client --bin horizon-client -p horizon-ctl --bin horizon-ctl -p horizon-prepare --bin horizon-prepare -p horizon-server --bin horizon-server

      - name: Package Game (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path game-dist/horizon-windows-x64 -Force
          Copy-Item target/release/horizon-client.exe game-dist/horizon-windows-x64/
          Copy-Item target/release/horizon-ctl.exe game-dist/horizon-windows-x64/
          Copy-Item target/release/horizon-prepare.exe game-dist/horizon-windows-x64/
          Copy-Item target/release/horizon-server.exe game-dist/horizon-windows-x64/
          if (Test-Path crates) { Copy-Item -Recurse crates game-dist/horizon-windows-x64/ }
          if (Test-Path mods) { Copy-Item -Recurse mods game-dist/horizon-windows-x64/ }
          if (Test-Path tools) { Copy-Item -Recurse tools game-dist/horizon-windows-x64/ }
          if (Test-Path packaging/PLAY.txt) { Copy-Item packaging/PLAY.txt game-dist/horizon-windows-x64/ }
          if (Test-Path research-lock.json) { Copy-Item research-lock.json game-dist/horizon-windows-x64/ }
          if (Test-Path LICENSE) { Copy-Item LICENSE game-dist/horizon-windows-x64/ }
          Compress-Archive -Path game-dist/horizon-windows-x64/* -DestinationPath horizon-windows-x64.zip

      - name: Build Game (Linux)
        if: runner.os == 'Linux'
        run: cargo build --release -p horizon-client --bin horizon-client -p horizon-ctl --bin horizon-ctl -p horizon-prepare --bin horizon-prepare -p horizon-server --bin horizon-server

      - name: Package Game (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p game-dist/horizon-linux-x86_64
          cp target/release/horizon-client target/release/horizon-ctl target/release/horizon-prepare target/release/horizon-server game-dist/horizon-linux-x86_64/
          [ -d crates ] && cp -r crates game-dist/horizon-linux-x86_64/ || true
          [ -d mods ] && cp -r mods game-dist/horizon-linux-x86_64/ || true
          [ -d tools ] && cp -r tools game-dist/horizon-linux-x86_64/ || true
          [ -f packaging/PLAY.txt ] && cp packaging/PLAY.txt game-dist/horizon-linux-x86_64/ || true
          [ -f research-lock.json ] && cp research-lock.json game-dist/horizon-linux-x86_64/ || true
          [ -f LICENSE ] && cp LICENSE game-dist/horizon-linux-x86_64/ || true
          tar -czf horizon-linux-x86_64.tar.gz -C game-dist horizon-linux-x86_64

      - name: Package Artifact (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          cd launcher/target/${{ matrix.target }}/dist
          tar -czf ../../../../${{ matrix.asset }} ${{ matrix.binary }}
          cd ../../../..

      - name: Package Artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path launcher/target/${{ matrix.target }}/dist/${{ matrix.binary }} -DestinationPath ${{ matrix.asset }}
          $csc = "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          $src = (Resolve-Path "packaging/windows/installer.cs").Path
          $icon = (Resolve-Path "packaging/icons/horizon.ico").Path
          $res = (Resolve-Path "launcher/target/${{ matrix.target }}/dist/${{ matrix.binary }}").Path
          & $csc /target:winexe /optimize+ /platform:x64 "/win32icon:$icon" "/resource:$res,HorizonLauncher" /out:Borizon-Setup.exe "$src"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.os }}
          path: |
            ${{ matrix.asset }}
            ${{ matrix.game_asset }}
            Borizon-Setup.exe
          if-no-files-found: ignore

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release-dist
          find artifacts -type f -exec cp {} release-dist/ \;
          cd release-dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag_name || github.ref_name }}
        run: |
          TAG_NAME="${TAG:-v0.2.32-offline}"
          {
            echo "Borizon Offline: high-FPS optimized, fully offline."
            echo ""
            echo "- Direct Mojang downloads with zero Microsoft account dependency."
            echo "- Hardware early-Z rasterization bypasses multi-pass occlusion stalls on integrated GPUs."
            echo "- Immediate presentation mode fallback prevents 36 FPS lock."
            echo "- Native vectorization and branchless WGSL shaders."
            echo "- Fully packaged installer and game binaries."
          } > notes.md
          gh release create "$TAG_NAME" release-dist/* --title "Borizon $TAG_NAME" --notes-file notes.md --target "$GITHUB_SHA" || gh release upload "$TAG_NAME" release-dist/* --clobber
