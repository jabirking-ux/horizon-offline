name: Build and Release Horizon Offline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag or Version (e.g. v0.2.32-offline)'
        required: false
        default: 'v0.2.32-offline'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            binary: horizon-launcher
            asset: horizon-launcher-linux-x86_64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: horizon-launcher.exe
            asset: horizon-launcher-windows-x64.zip
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: horizon-launcher
            asset: horizon-launcher-macos-arm64.tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libvulkan-dev libwayland-dev libx11-dev libxkbcommon-dev libfontconfig1-dev

      - name: Build Launcher
        run: cargo build --profile dist --manifest-path launcher/Cargo.toml --target ${{ matrix.target }}

      - name: Package Artifact (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/dist
          tar -czf ../../../${{ matrix.asset }} ${{ matrix.binary }}
          cd ../../..

      - name: Package Artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path target/${{ matrix.target }}/dist/${{ matrix.binary }} -DestinationPath ${{ matrix.asset }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release-dist
          find artifacts -type f -exec cp {} release-dist/ \;
          cd release-dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag_name || github.ref_name }}
        run: |
          TAG_NAME="${TAG:-v0.2.32-offline}"
          {
            echo "Horizon Offline: more optimized, fully offline."
            echo ""
            echo "- No Microsoft account, Xbox Live or keyring code."
            echo "- The prepare step downloads the client, libraries, assets and sounds straight from Mojang and checks every SHA-1."
            echo "- Launch offline once setup is done."
          } > notes.md
          gh release create "$TAG_NAME" release-dist/* --title "Horizon Offline $TAG_NAME" --notes-file notes.md --target "$GITHUB_SHA"
